<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Carnet Minceur 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --fuchsia-bright: #ff007f;
      --primary-dark: #c71585;
      --card-bg: linear-gradient(145deg, #ffffff, #ffe3ed);
      --card-border: #ffb6c1;
      --text-color: #4a0033;
      --bg-page: #fde8ef;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Quicksand', 'Poppins', sans-serif !important; 
    }
    
    body { 
      background-color: var(--bg-page); 
      margin: 0; 
      padding-bottom: 120px; 
      color: var(--text-color); 
      font-size: 15px; 
    }
    
    header { 
      background: linear-gradient(180deg, #ffffff 0%, #ffe6f0 100%); 
      padding: 15px 12px; 
      text-align: center; 
      border-bottom: 3px solid var(--fuchsia-bright); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      box-shadow: 0 6px 20px rgba(255, 0, 127, 0.25); 
      border-radius: 0 0 25px 25px;
    }
    
    .welcome-banner {
      background: #ffffff !important;
      border: 3px solid #ff007f !important;
      border-radius: 20px;
      padding: 12px !important;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.25);
    }

    .welcome-title {
      font-size: 20px !important;
      color: #ff007f !important;
      font-weight: 700 !important;
      margin: 0 0 4px 0 !important;
    }

    .welcome-quote {
      font-size: 14px !important;
      color: #c71585 !important;
      font-style: italic !important;
      font-weight: 700 !important;
      margin: 0 !important;
    }

    /* GAUGE STYLES */
    .calorie-gauge-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 10px 0;
      background: #ffffff;
      padding: 10px;
      border-radius: 20px;
      border: 2px solid var(--card-border);
    }

    .gauge-svg {
      width: 90px;
      height: 90px;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: #ffe3ed;
      stroke-width: 8;
    }

    .gauge-progress {
      fill: none;
      stroke: var(--fuchsia-bright);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2;
      transition: stroke-dashoffset 0.5s ease;
    }

    .gauge-info {
      text-align: left;
    }

    .gauge-info div {
      margin: 2px 0;
      font-weight: 600;
      font-size: 13px;
    }

    .gauge-info span {
      font-weight: 700;
      color: var(--fuchsia-bright);
    }
    
    .date-nav { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 15px; 
      margin-top: 8px; 
      font-weight: 700; 
      font-size: 16px; 
      color: var(--primary-dark);
    }
    
    .date-nav button { 
      background: #ffe3ed; 
      border: 2px solid var(--fuchsia-bright); 
      border-radius: 50%; 
      font-size: 16px; 
      color: var(--fuchsia-bright); 
      cursor: pointer; 
      width: 34px; 
      height: 34px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }

    .week-badge { 
      background: linear-gradient(135deg, #ff007f, #c71585); 
      color: white; 
      padding: 4px 16px; 
      border-radius: 20px; 
      font-size: 13px; 
      margin-top: 6px; 
      display: inline-block; 
      font-weight: 700; 
    }

    .container { padding: 15px; max-width: 650px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { 
      background: var(--card-bg); 
      border-radius: 22px; 
      padding: 18px; 
      margin-bottom: 20px; 
      box-shadow: 0 6px 18px rgba(255, 20, 147, 0.12); 
      border: 2px solid var(--card-border); 
    }
    
    .card-title { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-weight: 700; 
      color: var(--primary-dark); 
      margin-bottom: 14px; 
      font-size: 17px; 
      background: #ffe8f0; 
      padding: 10px 16px; 
      border-radius: 16px; 
      border-left: 5px solid var(--fuchsia-bright);
    }

    .input-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; position: relative; }
    
    input, select { 
      padding: 10px 12px; 
      border: 2px solid var(--card-border); 
      border-radius: 14px; 
      font-size: 14px; 
      outline: none; 
      background: #fff9fc; 
      color: var(--text-color); 
      font-weight: 600;
    }
    
    .input-flex { flex: 1; min-width: 120px; }
    .input-small { width: 85px; }
    
    button.btn-add { 
      background: linear-gradient(135deg, #ff007f, #c71585); 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 16px; 
      cursor: pointer; 
    }

    /* AUTOCOMPLETE DROPDOWN */
    .autocomplete-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 95px;
      background: white;
      border: 2px solid var(--fuchsia-bright);
      border-radius: 12px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: none;
    }

    .autocomplete-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #ffe3ed;
      font-size: 14px;
    }

    .autocomplete-item:hover {
      background: #ffe3ed;
      color: var(--fuchsia-bright);
    }

    .item-list { list-style: none; padding: 0; margin: 0; }
    .item-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 8px; 
      border-bottom: 1px solid #ffb6c1; 
      font-size: 14px; 
    }
    .item-actions { display: flex; align-items: center; gap: 8px; }
    
    .qty-edit { 
      background: #ffe3ed; 
      border: 1.5px solid var(--fuchsia-bright); 
      border-radius: 10px; 
      padding: 4px 10px; 
      font-weight: 700; 
      cursor: pointer; 
      color: var(--primary-dark); 
    }
    .btn-delete { color: #ff0055; background: none; border: none; cursor: pointer; font-size: 18px; padding: 0 4px; font-weight: bold; }

    nav.bottom-nav { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: #ffffff; 
      display: flex; 
      justify-content: space-around; 
      padding: 10px 0 14px 0; 
      border-top: 3px solid var(--card-border); 
      z-index: 1000; 
      border-radius: 20px 20px 0 0;
    }
    .nav-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      background: none; 
      border: none; 
      color: #b2bec3; 
      font-size: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      gap: 3px; 
      flex: 1; 
    }
    .nav-item.active { color: var(--fuchsia-bright); }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

    /* MODAL POPUP */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      border: 3px solid var(--fuchsia-bright);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="welcome-banner">
      <h1 class="welcome-title">🌸 Bonjour Nathalie 👋 🌸</h1>
      <p class="welcome-quote">✨ « Manger mieux pour vivre mieux » ✨</p>
    </div>

    <!-- CERCLE DE JAUGE DE CALORIES -->
    <div class="calorie-gauge-container">
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-bg" cx="50" cy="50" r="40" />
        <circle class="gauge-progress" id="gauge-circle" cx="50" cy="50" r="40" />
      </svg>
      <div class="gauge-info">
        <div>Consommé : <span id="gauge-consumed">0</span> / <input type="number" id="target-kcal-input" value="1600" style="width:65px; padding:2px 5px;" onchange="updateGauge()"> kcal</div>
        <div>Restant : <span id="gauge-remaining">1600</span> kcal</div>
      </div>
    </div>

    <div class="date-nav">
      <button onclick="changeDate(-1)">❮</button>
      <span id="current-date-display">...</span>
      <button onclick="changeDate(1)">❯</button>
    </div>
    <div class="week-badge" id="week-display">🌸 Semaine 15 🌸</div>
  </header>

  <div class="container">

    <div id="tab-repas" class="tab-content active">
      <div id="meals-container"></div>
    </div>

    <div id="tab-poids" class="tab-content">
      <div class="card">
        <div class="card-title">⚖️ Poids du Jour</div>
        <div class="input-group">
          <input type="number" step="0.1" id="weight-input" class="input-flex" placeholder="Poids (ex: 68.5 kg)">
          <button class="btn-add" onclick="saveWeight()">Enregistrer</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📈 Historique des Pesées</div>
        <ul id="weight-history" class="item-list"></ul>
      </div>
    </div>

    <div id="tab-aliments" class="tab-content">
      <div class="card">
        <div class="card-title">🍎 Ajouter un Aliment</div>
        <div class="input-group">
          <input type="text" id="new-food-name" class="input-flex" placeholder="Nom de l'aliment">
          <input type="number" id="new-food-kcal" class="input-small" placeholder="kcal/100g">
          <button class="btn-add" onclick="addCustomFood()">Ajouter</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📖 Base d'Aliments</div>
        <input type="text" id="search-food-db" placeholder="🔍 Rechercher un aliment..." style="width:100%; margin-bottom:12px;" oninput="renderFoodDB()">
        <ul id="food-db-list" class="item-list"></ul>
      </div>
    </div>

  </div>

  <!-- POPUP NOUVEL ALIMENT AUTOMATIQUE -->
  <div class="modal-overlay" id="add-food-modal">
    <div class="modal-card">
      <h3 style="color:var(--fuchsia-bright); margin-top:0;">Aliment Inconnu 🌸</h3>
      <p><strong id="modal-food-name-display"></strong> n'existe pas dans votre base.</p>
      <div style="margin-bottom:15px;">
        <input type="number" id="modal-food-kcal" placeholder="Calories pour 100g (kcal)" style="width:100%;">
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-add" style="flex:1;" onclick="confirmModalFood()">Enregistrer</button>
        <button style="flex:1; background:#b2bec3; border:none; color:white; border-radius:14px; font-weight:700;" onclick="closeModal()">Annuler</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('repas', event)">
      <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.35L4 22h2.1l1.9-8h2l1.9 8H14l-2.45-8.65C13.54 12.9 15 11.12 15 9V2h-2v7h-2zm9-7h-3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h1v8h2V4c0-1.1-.9-2-2-2z"/></svg>
      Repas
    </button>
    <button class="nav-item" onclick="switchTab('poids', event)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z"/></svg>
      Poids
    </button>
    <button class="nav-item" onclick="switchTab('aliments', event)">
      <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
      Aliments
    </button>
  </nav>

  <script>
    const REF_DATE = new Date(2026, 6, 27);
    const REF_WEEK = 15;
    let currentDate = new Date();
    let currentPendingMeal = null;

    function getWeekNumber(d) {
      const date = new Date(d);
      date.setHours(0,0,0,0);
      const day = date.getDay();
      const diffToMonday = date.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(date.setDate(diffToMonday));
      const diffTime = monday.getTime() - REF_DATE.getTime();
      return REF_WEEK + Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));
    }

    function formatDateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateDisplay(d) {
      return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function changeDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      updateAppView();
    }

    function safeParse(val) {
      if (typeof val !== 'string') return val;
      try { return JSON.parse(val); } catch(e) { return val; }
    }

    function getFoodDB() {
      let db = safeParse(localStorage.getItem('minceur_foodDb')) || safeParse(localStorage.getItem('food_db'));
      return Array.isArray(db) ? db : [];
    }

    function saveFoodDB(db) {
      localStorage.setItem('minceur_foodDb', JSON.stringify(db));
    }

    const MEAL_TYPES = ['Petit-déjeuner', 'Déjeuner', 'Collation', 'Dîner'];

    function getMealData(dateKey) {
      let result = { 'Petit-déjeuner': [], 'Déjeuner': [], 'Collation': [], 'Dîner': [] };
      let dailyMeals = safeParse(localStorage.getItem('minceur_dailyMeals')) || safeParse(localStorage.getItem('dailyMeals')) || {};
      
      if (dailyMeals && dailyMeals[dateKey]) {
        let dayData = dailyMeals[dateKey];
        MEAL_TYPES.forEach(m => {
          let arr = dayData[m] || dayData[m.toLowerCase()];
          if (Array.isArray(arr)) result[m] = arr;
        });
      }
      return result;
    }

    function saveMealData(dateKey, data) {
      let dailyMeals = safeParse(localStorage.getItem('minceur_dailyMeals')) || {};
      dailyMeals[dateKey] = data;
      localStorage.setItem('minceur_dailyMeals', JSON.stringify(dailyMeals));
    }

    window.onload = function() {
      updateAppView();
    };

    function updateAppView() {
      const dateKey = formatDateKey(currentDate);
      document.getElementById('current-date-display').innerText = formatDateDisplay(currentDate);
      document.getElementById('week-display').innerText = `🌸 Semaine ${getWeekNumber(currentDate)} 🌸`;
      
      renderMealsView(dateKey);
      renderWeightView(dateKey);
      renderFoodDB();
      updateGauge();
    }

    function renderMealsView(dateKey) {
      const mealsData = getMealData(dateKey);
      const container = document.getElementById('meals-container');
      container.innerHTML = '';

      MEAL_TYPES.forEach(meal => {
        const items = mealsData[meal] || [];
        const mealKcal = items.reduce((sum, item) => sum + (item.kcalTotal || item.kcal || 0), 0);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">
            <span>${meal}</span>
            <span>${mealKcal} kcal</span>
          </div>
          <div class="input-group">
            <input type="text" id="input-food-${meal}" class="input-flex" placeholder="Nom de l'aliment (min. 2 lettres)" oninput="handleFoodInput('${meal}')" autocomplete="off">
            <div id="autocomplete-${meal}" class="autocomplete-results"></div>
            <input type="number" id="input-qty-${meal}" class="input-small" placeholder="Grammes">
            <button class="btn-add" onclick="addFoodToMeal('${meal}')">+</button>
          </div>

          <ul class="item-list">
            ${items.map((item, idx) => {
              const qtyDisplay = item.grams || item.qty || item.quantite || 0;
              const kcalDisplay = item.kcalTotal || item.kcal || 0;
              return `
              <li class="item-row">
                <span><strong>${item.name || item.nom}</strong></span>
                <div class="item-actions">
                  <span class="qty-edit" onclick="editItemQty('${meal}', ${idx})">${qtyDisplay}g</span>
                  <span><strong>${kcalDisplay} kcal</strong></span>
                  <button class="btn-delete" onclick="deleteMealItem('${meal}', ${idx})">✕</button>
                </div>
              </li>
            `}).join('')}
          </ul>
        `;
        container.appendChild(card);
      });
    }

    /* AUTOCOMPLÉTION DÈS 2 LETTRES */
    function handleFoodInput(meal) {
      const input = document.getElementById(`input-food-${meal}`);
      const val = input.value.trim().toLowerCase();
      const resultsContainer = document.getElementById(`autocomplete-${meal}`);
      
      if (val.length < 2) {
        resultsContainer.style.display = 'none';
        return;
      }

      const db = getFoodDB();
      const matches = db.filter(f => f.name.toLowerCase().includes(val));

      if (matches.length === 0) {
        resultsContainer.style.display = 'none';
        return;
      }

      resultsContainer.innerHTML = matches.map(f => `
        <div class="autocomplete-item" onclick="selectAutocomplete('${meal}', '${f.name}')">
          ${f.name} <small style="color:#c71585">(${f.kcal} kcal/100g)</small>
        </div>
      `).join('');
      resultsContainer.style.display = 'block';
    }

    function selectAutocomplete(meal, foodName) {
      document.getElementById(`input-food-${meal}`).value = foodName;
      document.getElementById(`autocomplete-${meal}`).style.display = 'none';
    }

    function addFoodToMeal(meal) {
      const dateKey = formatDateKey(currentDate);
      const foodName = document.getElementById(`input-food-${meal}`).value.trim();
      const qty = parseFloat(document.getElementById(`input-qty-${meal}`).value);

      if (!foodName || !qty) {
        alert("Veuillez saisir un aliment et sa quantité en grammes.");
        return;
      }

      const db = getFoodDB();
      const foodObj = db.find(f => f.name.toLowerCase() === foodName.toLowerCase());

      /* SI L'ALIMENT N'EXISTE PAS -> OVERLAY POPUP AUTOMATIQUE */
      if (!foodObj) {
        currentPendingMeal = { meal, name: foodName, qty };
        document.getElementById('modal-food-name-display').innerText = foodName;
        document.getElementById('modal-food-kcal').value = '';
        document.getElementById('add-food-modal').style.display = 'flex';
        return;
      }

      const kcalTotal = Math.round((foodObj.kcal * qty) / 100);
      const mealsData = getMealData(dateKey);
      mealsData[meal].push({ name: foodObj.name, grams: qty, kcalTotal: kcalTotal, kcalPer100: foodObj.kcal });
      
      saveMealData(dateKey, mealsData);
      renderMealsView(dateKey);
      updateGauge();
    }

    function confirmModalFood() {
      const kcalPer100 = parseFloat(document.getElementById('modal-food-kcal').value);
      if (!kcalPer100) return alert("Veuillez saisir les calories pour 100g.");

      const db = getFoodDB();
      db.push({ name: currentPendingMeal.name, kcal: kcalPer100 });
      saveFoodDB(db);

      closeModal();
      renderFoodDB();

      // Poursuivre l'ajout au repas
      addFoodToMeal(currentPendingMeal.meal);
    }

    function closeModal() {
      document.getElementById('add-food-modal').style.display = 'none';
    }

    function editItemQty(meal, idx) {
      const dateKey = formatDateKey(currentDate);
      const mealsData = getMealData(dateKey);
      const item = mealsData[meal][idx];
      const currentQty = item.grams || item.qty || 100;
      const kcalPer100 = item.kcalPer100 || (item.kcalTotal ? Math.round((item.kcalTotal / currentQty) * 100) : 100);

      const newQtyStr = prompt(`Quantité pour "${item.name}" (g) :`, currentQty);
      if (newQtyStr !== null && parseFloat(newQtyStr) > 0) {
        const newQty = parseFloat(newQtyStr);
        item.grams = newQty;
        item.kcalTotal = Math.round((kcalPer100 * newQty) / 100);
        saveMealData(dateKey, mealsData);
        renderMealsView(dateKey);
        updateGauge();
      }
    }

    function deleteMealItem(meal, idx) {
      const dateKey = formatDateKey(currentDate);
      const mealsData = getMealData(dateKey);
      mealsData[meal].splice(idx, 1);
      saveMealData(dateKey, mealsData);
      renderMealsView(dateKey);
      updateGauge();
    }

    /* GAUGE DE CALORIES DYNAMIQUE */
    function updateGauge() {
      const dateKey = formatDateKey(currentDate);
      const mealsData = getMealData(dateKey);
      let consumed = 0;

      MEAL_TYPES.forEach(m => {
        (mealsData[m] || []).forEach(item => {
          consumed += (item.kcalTotal || item.kcal || 0);
        });
      });

      const target = parseFloat(document.getElementById('target-kcal-input').value) || 1600;
      const remaining = Math.max(0, target - consumed);

      document.getElementById('gauge-consumed').innerText = consumed;
      document.getElementById('gauge-remaining').innerText = remaining;

      const circle = document.getElementById('gauge-circle');
      const maxOffset = 251.2;
      const pct = Math.min(1, consumed / target);
      circle.style.strokeDashoffset = maxOffset - (maxOffset * pct);
    }

    function getParsedWeights() {
      let raw = safeParse(localStorage.getItem('minceur_weightLog')) || [];
      return Array.isArray(raw) ? raw : [];
    }

    function renderWeightView(dateKey) {
      const weightsArr = getParsedWeights();
      const todayObj = weightsArr.find(w => w.date === dateKey);
      document.getElementById('weight-input').value = todayObj ? todayObj.weight : '';

      const historyUl = document.getElementById('weight-history');
      historyUl.innerHTML = '';
      
      weightsArr.sort((a,b) => b.date.localeCompare(a.date));
      weightsArr.forEach(w => {
        const li = document.createElement('li');
        li.className = 'item-row';
        li.innerHTML = `<span>${w.date} (Sem. ${getWeekNumber(new Date(w.date))})</span><strong>${w.weight} kg</strong>`;
        historyUl.appendChild(li);
      });
    }

    function saveWeight() {
      const dateKey = formatDateKey(currentDate);
      const val = parseFloat(document.getElementById('weight-input').value);
      let weightsArr = getParsedWeights().filter(w => w.date !== dateKey);
      if (val) weightsArr.push({ date: dateKey, weight: val });

      localStorage.setItem('minceur_weightLog', JSON.stringify(weightsArr));
      renderWeightView(dateKey);
      alert("Poids enregistré !");
    }

    function renderFoodDB() {
      const db = getFoodDB();
      const search = (document.getElementById('search-food-db').value || '').toLowerCase();
      const ul = document.getElementById('food-db-list');
      ul.innerHTML = '';

      db.filter(f => f.name.toLowerCase().includes(search))
        .sort((a,b) => a.name.localeCompare(b.name))
        .forEach((f) => {
          const li = document.createElement('li');
          li.className = 'item-row';
          li.innerHTML = `
            <span><strong>${f.name}</strong></span>
            <div class="item-actions">
              <span>${f.kcal} kcal/100g</span>
              <button class="btn-delete" onclick="deleteCustomFood('${f.name}')">✕</button>
            </div>
          `;
          ul.appendChild(li);
        });
    }

    function addCustomFood() {
      const name = document.getElementById('new-food-name').value.trim();
      const kcal = parseFloat(document.getElementById('new-food-kcal').value);
      if (!name || !kcal) return alert("Entrez un nom et le nombre de calories.");
      
      const db = getFoodDB();
      db.push({ name: name, kcal: kcal });
      saveFoodDB(db);
      renderFoodDB();
    }

    function deleteCustomFood(name) {
      let db = getFoodDB().filter(f => f.name !== name);
      saveFoodDB(db);
      renderFoodDB();
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabId}`).classList.add('active');
      if (evt) evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
